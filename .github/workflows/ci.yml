name: CI

# Roda sempre que um Pull Request for aberto ou atualizado com destino a main
on:
  pull_request:
    branches: [main]

jobs:
  # 1) Testes de caixa-branca do backend (JUnit, MockMvc e Mockito). Usam H2 em memoria.
  testes-backend:
    name: Testes do backend (Java)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configurar o Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Rodar os testes do backend
        working-directory: api
        run: ./mvnw -B test

  # 2) Testes de caixa-branca do frontend (Jest e Testing Library)
  testes-frontend:
    name: Testes do frontend (Jest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configurar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar as dependencias
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Rodar os testes do frontend
        working-directory: client
        run: npx jest --ci --coverage=false

  # 3) Testes de caixa-preta (E2E e API) com o sistema inteiro rodando
  testes-e2e-api:
    name: Testes E2E e de API (Playwright)
    runs-on: ubuntu-24.04
    needs: [testes-backend, testes-frontend]

    # Banco de dados MySQL usado pela API
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/sqa?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - name: Configurar o Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Iniciar a API (porta 8080)
        working-directory: api
        run: |
          nohup ./mvnw -B spring-boot:run > ../api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null "http://localhost:8080/posts/liked?userId=1"; then
              echo "API no ar"; exit 0
            fi
            sleep 3
          done
          echo "A API nao subiu a tempo"; cat ../api.log; exit 1

      - name: Instalar as dependencias do cliente e gerar o build
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Iniciar o cliente (porta 3000)
        working-directory: client
        run: |
          nohup npm run start > ../client.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://localhost:3000"; then
              echo "Cliente no ar"; exit 0
            fi
            sleep 3
          done
          echo "O cliente nao subiu a tempo"; cat ../client.log; exit 1

      - name: Instalar as dependencias do Playwright e o Chromium
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Rodar os testes E2E e de API
        working-directory: tests
        run: npx playwright test

      - name: Anexar o relatorio do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

      - name: Mostrar o log da API se algo falhar
        if: failure()
        run: tail -n 200 api.log
